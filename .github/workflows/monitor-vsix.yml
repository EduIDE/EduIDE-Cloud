# Packages the session monitor VS Code extension. release.yml calls this and
# attaches the vsix to the release.
#
# The IDE image (EduIDE) installs this by URL from a release asset, the same way it
# installs data-bridge. Nothing else builds node/monitor, so the pull_request trigger
# exists to catch a broken package before a release depends on it.
name: Monitor VSIX

on:
  pull_request:
    branches:
      - main
    paths:
      - 'node/monitor/**'
      - '.github/workflows/monitor-vsix.yml'

  # Called by release.yml with the release version.
  workflow_call:
    inputs:
      version:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the vsix (e.g. 1.2.0). Defaults to the manifest version."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node/monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve version
        id: version
        shell: bash
        env:
          RAW: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "VERSION=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp version
        if: steps.version.outputs.VERSION != ''
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      # vsce runs `vscode:prepublish` (webpack --mode production) itself, so the bundle
      # in the vsix is always built from this checkout.
      - name: Package VSIX
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: npx vsce package --allow-star-activation --skip-license --out "theia-cloud-monitor${VERSION:+-$VERSION}.vsix"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: theia-cloud-monitor-vsix
          path: node/monitor/theia-cloud-monitor*.vsix
          if-no-files-found: error
