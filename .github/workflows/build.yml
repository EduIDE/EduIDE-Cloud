name: Build and Push Theia Cloud Images

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  schedule:
    - cron: '0 2 * * *'

  # Called by release.yml, which passes the release version as image_tag.
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag, e.g. 2.3.0 (no leading v)"
        required: false
        default: ""
        type: string
      disable_layer_cache:
        required: false
        default: false
        type: boolean

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag override (e.g. my-test-tag, or 2.3.0 for the release train)"
        required: false
        default: ""
        type: string
      disable_layer_cache:
        description: "Disable the Docker layer cache (--no-cache) for stress testing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.component }}
    strategy:
      # One component failing must not cancel the other two.
      fail-fast: false
      matrix:
        include:
          - component: operator
          - component: service
          - component: conversion-webhook
    uses: EduIDE/.github/.github/workflows/build-and-push-docker-image.yml@v1
    with:
      docker-file: dockerfiles/${{ matrix.component }}/Dockerfile
      image-name: eduide/eduide-cloud/${{ matrix.component }}
      docker-context: .
      # release.yml passes the version here, without a leading v. An override
      # is used verbatim by the shared workflow, so a `v1.2.0` would be
      # published as `v1.2.0` - a tag no chart can consume, since appVersion
      # and the image tag must be one string. Without it, a run on main would
      # derive `latest`.
      image-tag: ${{ inputs.image_tag || '' }}
      # The Java build stamps the version into the jar manifest, so the version
      # inside the image should match the tag on the outside. The shared workflow
      # derives the tag (stripping any leading v) and passes it as APP_VERSION.
      stamp-app-version: true
      no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.disable_layer_cache) || false }}
      # These are small Java images; the disk-reclaim step is not worth the time.
      free-disk-space: false
    secrets:
      # Sentry's source bundle upload is off: it fails the whole image build when the
      # Sentry server is unreachable. Set the repository variable SENTRY_BUILD_ENABLED
      # to true (with the SENTRY_AUTH_TOKEN secret) to turn it back on.
      docker-secrets: ${{ vars.SENTRY_BUILD_ENABLED == 'true' && secrets.SENTRY_AUTH_TOKEN != '' && format('SENTRY_AUTH_TOKEN={0}', secrets.SENTRY_AUTH_TOKEN) || '' }}
