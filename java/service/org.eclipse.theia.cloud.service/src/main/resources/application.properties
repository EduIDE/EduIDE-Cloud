quarkus.http.port=8081
quarkus.http.read-timeout=5M

# CORS stays off until origins are configured (QUARKUS_HTTP_CORS_ENABLED=true and
# QUARKUS_HTTP_CORS_ORIGINS=<landing page origin>; the image entrypoint sets both from CORS_ORIGINS).

# Health, metrics and the OpenAPI document are served on a separate management port that is not part of the
# public route.
quarkus.management.enabled=true
quarkus.management.port=9000
quarkus.management.host=0.0.0.0

# OIDC Configuration
quarkus.oidc.enabled=true
#quarkus.oidc.auth-server-url=https://keycloak.url/auth/realms/TheiaCloud
#quarkus.oidc.client-id=theia-cloud
#quarkus.oidc.credentials.secret=publicbutoauth2proxywantsasecret
# Tokens are checked for an audience only if QUARKUS_OIDC_TOKEN_AUDIENCE is set. The certificate of the
# identity provider is always verified; a private CA goes into a trust store (the image entrypoint sets up the TLS registry configuration "oidc" from KEYCLOAK_TRUSTSTORE_FILE).
